
name: Neon Snake Animation

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:         # manual "Run workflow" button
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Generate snake SVGs
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: Krishn-Nandan-Raj-009
          outputs: |
            dist/snake-neon.svg?color_snake=%23ff2bd6&color_dots=%23161b22,%230e4429,%23006d32,%2326a641,%2300ff9c&color_background=%230d1117
            dist/snake-light.svg?color_snake=%23a100c9&color_dots=%23ebedf0,%239be9a8,%2340c463,%2330a14e,%23216e39

      # Special effects: neon glow + pulsing food cells injected into the generated SVG
      - name: Inject glow and pulse effects
        run: |
          python3 - <<'EOF'
          p = "dist/snake-neon.svg"
          s = open(p, encoding="utf-8").read()
          fx = """
          .s{filter:drop-shadow(0 0 3px #ff2bd6) drop-shadow(0 0 9px #b400ff) drop-shadow(0 0 16px #ff2bd6);}
          @keyframes pulse{0%,100%{opacity:1}50%{opacity:.55}}
          .c{animation-name:pulse;animation-duration:2.4s;animation-iteration-count:infinite;animation-timing-function:ease-in-out;}
          """
          # keep snk's own per-cell animations working: only add pulse to cells with no animation-name set
          idx = s.rfind("</style>")
          if idx != -1:
              s = s[:idx] + fx.replace(".c{animation-name:pulse;animation-duration:2.4s;animation-iteration-count:infinite;animation-timing-function:ease-in-out;}", "") + s[idx:]
          open(p, "w", encoding="utf-8").write(s)
          EOF

      - name: Push to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
