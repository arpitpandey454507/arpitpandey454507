<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 130" width="1000" height="130" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="0">
<stop offset="0" stop-color="#0A0E14"/><stop offset=".5" stop-color="#101826"/><stop offset="1" stop-color="#0A0E14"/>
</linearGradient>
<linearGradient id="bd" x1="0" y1="0" x2="1" y2="0" gradientUnits="objectBoundingBox">
<stop offset="0" stop-color="#5EEAD4"><animate attributeName="stop-color" values="#5EEAD4;#8B7CFC;#5EEAD4" dur="6s" repeatCount="indefinite"/></stop>
<stop offset="1" stop-color="#8B7CFC"><animate attributeName="stop-color" values="#8B7CFC;#5EEAD4;#8B7CFC" dur="6s" repeatCount="indefinite"/></stop>
</linearGradient>
<linearGradient id="tt" x1="0" y1="0" x2="1" y2="0">
<stop offset="0" stop-color="#5EEAD4"/><stop offset="1" stop-color="#8B7CFC"/>
</linearGradient>
<clipPath id="ty"><rect x="40" y="78" height="30" width="0">
<animate attributeName="width" values="0;560;560;0;0" keyTimes="0;.45;.85;.95;1" dur="9s" repeatCount="indefinite"/>
</rect></clipPath>
<path id="rail" d="M30 118 H970"/>
</defs>
<style>
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.25;transform:scale(1.6)}}
.pd{animation:pulse 1.4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes glow{0%,100%{opacity:.55}50%{opacity:1}}
.gl{animation:glow 3s ease-in-out infinite}
@keyframes sc{0%{transform:translateX(-120px)}100%{transform:translateX(1100px)}}
.sc{animation:sc 5s linear infinite}
</style>
<rect x="3" y="3" width="994" height="124" rx="16" fill="url(#bg)"/>
<rect x="3" y="3" width="994" height="124" rx="16" fill="none" stroke="url(#bd)" stroke-width="2" stroke-dasharray="14 8">
<animate attributeName="stroke-dashoffset" from="0" to="-88" dur="3s" repeatCount="indefinite"/>
</rect>
<rect class="sc" x="0" y="3" width="90" height="124" fill="#5EEAD4" fill-opacity=".07" transform="skewX(-20)"/>
<text class="gl" x="40" y="58" font-family="'Segoe UI',Arial,sans-serif" font-size="34" font-weight="800" fill="url(#tt)">🐍 Contribution Snake</text>
<g clip-path="url(#ty)"><text x="40" y="100" font-family="'Fira Code',Consolas,monospace" font-size="16" fill="#9aa4b2">&gt; eating commits, one green box at a time...</text></g>
<g transform="translate(880 44)">
<rect x="0" y="-16" width="82" height="32" rx="16" fill="#ff4d6d" fill-opacity=".15" stroke="#ff4d6d" stroke-width="1.5"/>
<circle class="pd" cx="20" cy="0" r="5" fill="#ff4d6d"/>
<text x="34" y="5" font-family="'Segoe UI',Arial,sans-serif" font-size="14" font-weight="800" fill="#ff4d6d" letter-spacing="2">LIVE</text>
</g>
<g>
<circle r="6" fill="#8B7CFC"><animateMotion dur="7s" repeatCount="indefinite" rotate="none"><mpath href="#rail"/></animateMotion></circle>
<circle r="5" fill="#5EEAD4" fill-opacity=".9"><animateMotion dur="7s" begin="-0.18s" repeatCount="indefinite"><mpath href="#rail"/></animateMotion></circle>
<circle r="4.2" fill="#5EEAD4" fill-opacity=".7"><animateMotion dur="7s" begin="-0.36s" repeatCount="indefinite"><mpath href="#rail"/></animateMotion></circle>
<circle r="3.4" fill="#5EEAD4" fill-opacity=".5"><animateMotion dur="7s" begin="-0.54s" repeatCount="indefinite"><mpath href="#rail"/></animateMotion></circle>
<circle r="2.6" fill="#5EEAD4" fill-opacity=".3"><animateMotion dur="7s" begin="-0.72s" repeatCount="indefinite"><mpath href="#rail"/></animateMotion></circle>
</g>
</svg>
